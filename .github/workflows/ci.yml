name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run it by hand from the Actions tab ("Run workflow"): the only way the end-to-end tests run.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Biome lint + format check + JSX spacing (scripts/jsx-spacing.mjs)
      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm test

  e2e:
    # The editor in headless Chromium (e2e/, ADR-0069), split over three machines to stay quick.
    # On demand only: in CI's software rendering they're slow and time out under load, so they're
    # run locally for the area a change touches, and here when started from the Actions tab.
    if: github.event_name == 'workflow_dispatch'
    name: End-to-end tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # Starts the dev server itself (playwright.config.ts → webServer).
      - run: pnpm e2e --shard=${{ matrix.shard }}/3

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7
